name = "0xsteak/novaui"
version = "0.1.0"
authors = ["0xsteak"]
license = "MIT"

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[dependencies]
Signal = { wally = "molyidev/signal", version = "^1.0.3" }

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
Jest = { wally = "jsdotlua/jest", version = "^3.10.0" }
JestGlobals = { wally = "jsdotlua/jest-globals", version = "^3.10.0" }
TestEZ = { wally = "roblox/testez", version = "^0.4.1" }

